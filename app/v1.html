<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Checkout v1</title>
<style>body{font-family:sans-serif;max-width:420px;margin:40px auto}label{display:block;margin-top:12px}input{width:100%;padding:6px}button{margin-top:16px;padding:8px 16px}.err{color:#b00020}.ok{color:#0a7d32}</style></head>
<body><h1>Checkout</h1>
<form id="checkout-form" novalidate>
<label for="email">Email</label><input id="email" name="email" type="email" data-testid="email-input">
<label for="qty">Quantity</label><input id="qty" name="qty" type="number" value="1" data-testid="qty-input">
<label for="coupon">Coupon code</label><input id="coupon" name="coupon" data-testid="coupon-input">
<p>Total: $<span id="total" data-testid="total">20.00</span></p>
<button id="pay-btn" class="btn-primary" type="submit" data-testid="pay-button">Pay now</button>
<button id="cancel-btn" type="button" data-testid="cancel-button">Cancel order</button>
</form><p id="msg" role="status" data-testid="message"></p>
<script src="app.js"></script></body></html>
